plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'eclipse'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    // Mod Menu
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

// Confee is not public on Modrinth yet: its Fabric jar, built from the Confee sources, is copied to .SourcesMods
def confeeJar = file(confee_jar)
if (!confeeJar.exists()) {
    throw new GradleException("Confee jar not found at ${confeeJar}. Build Confee first or set confee_jar in gradle.properties.")
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // config file and generated config screen, required at runtime
    modImplementation files(confeeJar)
    // only to test the config button in the mod list, Confee adds it
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version : minecraft_version,
            loader_version    : loader_version,
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_license       : mod_license,
            mod_version       : mod_version,
            mod_authors       : mod_authors,
            mod_description   : mod_description,
            java_version      : java_version
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = java_version as int
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
